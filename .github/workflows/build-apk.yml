name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
  APP_ANDROID_ACCEPT_SDK_LICENSE: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Create Buildozer spec
        run: |
          buildozer init

      - name: Configure Buildozer
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          text = p.read_text()

          text = text.replace(
              "title = My Application",
              "title = JARVIS"
          )

          text = text.replace(
              "package.name = myapp",
              "package.name = jarvis"
          )

          text = text.replace(
              "package.domain = org.test",
              "package.domain = org.jarvis"
          )

          text = text.replace(
              "# android.accept_sdk_license = False",
              "android.accept_sdk_license = True"
          )

          text = text.replace(
              "# android.permissions =",
              "android.permissions = INTERNET,RECORD_AUDIO"
          )

          text = text.replace(
              "# orientation = portrait",
              "orientation = portrait"
          )

          p.write_text(text)
          PY

          echo "===== Buildozer configuration ====="
          grep -E "^(title|package.name|package.domain|android.accept_sdk_license|android.permissions|orientation)" buildozer.spec || true

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: bin/*.apk
          if-no-files-found: error
