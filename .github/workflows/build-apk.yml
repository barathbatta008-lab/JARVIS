name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Create Buildozer spec
        run: buildozer init

      - name: Configure Buildozer
        run: |
          sed -i 's/title = My Application/title = JARVIS/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = jarvis/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.jarvis/' buildozer.spec
          sed -i 's/# android.permissions =/android.permissions = INTERNET,RECORD_AUDIO/' buildozer.spec

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: bin/*.apk
