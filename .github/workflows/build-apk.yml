name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Create Buildozer spec
        run: buildozer init

      - name: Configure Buildozer
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          text = p.read_text()

          replacements = {
              "title = My Application": "title = JARVIS",
              "package.name = myapp": "package.name = jarvis",
              "package.domain = org.test": "package.domain = org.jarvis",
              "requirements = python3,kivy": "requirements = python3,kivy",
              "orientation = portrait": "orientation = portrait",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          lines = text.splitlines()
          output = []

          for line in lines:
              if line.startswith("# android.permissions ="):
                  output.append("android.permissions = INTERNET,RECORD_AUDIO")
              else:
                  output.append(line)

          p.write_text("\n".join(output) + "\n")
          PY

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: bin/*.apk
